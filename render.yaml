databases:
  - name: intellisages-rwa-db
    databaseName: intellisages_rwa
    user: intellisages_rwa
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: intellisages-rwa-api
    runtime: python
    region: frankfurt
    plan: free
    # Keep the service rooted at the repository so Render always resolves
    # the backend working directory explicitly in the start command.
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    # Free web services do not support pre-deploy commands. Run migrations
    # against the service DATABASE_URL before starting the API process.
    startCommand: cd backend && python -m alembic -c alembic.ini -x verify_schema=true upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: intellisages-rwa-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.10
