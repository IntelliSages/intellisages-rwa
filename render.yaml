databases:
  - name: intellisages-rwa-db
    databaseName: intellisages_rwa
    user: intellisages_rwa
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: intellisages-rwa-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Free web services do not support pre-deploy commands.
    # Run migrations at startup before serving requests.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: intellisages-rwa-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.10
